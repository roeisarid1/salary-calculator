<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מחשבון שכר</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>💰 מחשבון שכר</h1>

      <label for="salary">שכר לשעה</label>
      <input type="number" id="salary" placeholder="הכנס שכר לשעה" min="0.01" step="0.01" />

      <label for="file">בחר קובץ אקסל</label>
      <input type="file" id="file" accept=".xlsx,.xls" />

      <button id="calcBtn">חשב</button>

      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
